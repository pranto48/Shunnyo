<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="shunnyoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Disc -->
  <rect width="512" height="512" rx="128" fill="#070a12" />
  
  <!-- Outer Glow Orbit -->
  <circle cx="256" cy="256" r="160" stroke="url(#shunnyoGrad)" stroke-width="28" stroke-linecap="round" filter="url(#glow)" stroke-dasharray="750 250" />
  
  <!-- Inner Ring (Zero / Shunnyo concept) -->
  <circle cx="256" cy="256" r="120" stroke="url(#innerGlow)" stroke-width="16" />
  
  <!-- Core Spark Center -->
  <circle cx="256" cy="256" r="32" fill="url(#shunnyoGrad)" />
  <circle cx="360" cy="180" r="16" fill="#06b6d4" filter="url(#glow)" />
</svg>
