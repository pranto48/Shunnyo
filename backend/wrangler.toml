name = "shunnyo-backend"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 1. Cloudflare D1 Database Binding (User Public Keys & Metadata)
[[d1_databases]]
binding = "DB"
database_name = "shunnyo-db"
database_id = "3aa8d80b-f709-4369-8543-802662aba6a5"

# 2. Cloudflare R2 Storage Bucket Binding (E2EE Encrypted Files & Media)
[[r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "shunnyo-e2ee-vault"

# 3. Cloudflare Durable Objects for WebRTC WebSocket Room Orchestration
[durable_objects]
bindings = [
  { name = "SIGNALING_ROOM", class_name = "SignalingRoom" }
]

# Durable Objects migration for SQLite storage (Free tier & Standard tier compatible)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalingRoom"]

# 4. Environment Variables
[vars]
ENVIRONMENT = "production"
APP_NAME = "Shunnyo Cloudflare Backend"
CORS_ORIGIN = "*"
